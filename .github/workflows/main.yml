name: run-tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    sqlite:
        name: sqlite - P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']
                laravel: ['12.*']
                stability: [prefer-stable]
                include:
                    - laravel: '12.*'
                      testbench: '^10.0'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite, bcmath, intl, fileinfo
                  coverage: none

            - name: Setup problem matchers
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  composer update --${{ matrix.stability }} --prefer-dist --no-interaction

            - name: Execute tests
              run: vendor/bin/pest

    postgres:
        name: postgres ${{ matrix.postgres }} - P${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']
                postgres: ['16', '17']

        services:
            postgres:
                image: postgres:${{ matrix.postgres }}
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql, sqlite3, pdo_sqlite, bcmath, intl, fileinfo
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-stable --prefer-dist --no-interaction

            # Sem isto os testes PG-only sao pulados e o job passa vazio.
            - name: Execute tests against PostgreSQL
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: testing
                  DB_USERNAME: postgres
                  DB_PASSWORD: postgres
              run: vendor/bin/pest
